spring.application.name=sigestec-backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./sigestec-demo-v2;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=24MB
app.jwt.secret=${JWT_SECRET_BASE64:}
app.demo.enabled=${SIGESTEC_DEMO:true}
app.demo.password=${SIGESTEC_DEMO_PASSWORD:Cambiar2026!}
app.storage.directory=${SIGESTEC_STORAGE_DIR:./archivos-sigestec}
app.storage.public-base-url=${SIGESTEC_PUBLIC_BASE_URL:http://localhost:8080}
