# Activar con: --spring.profiles.active=oracle
# Debe existir el esquema SIGESTEC_ADS creado previamente.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:SIGESTEC_ADS}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Evita que JPA cree o modifique tablas que deben corresponder al modelo ADS.
spring.jpa.hibernate.ddl-auto=validate
app.demo.enabled=false
